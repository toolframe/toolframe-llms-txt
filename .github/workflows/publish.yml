name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Require a matching version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Check tag against project version
        env:
          PUBLISH_REPOSITORY: ${{ inputs.repository }}
        run: python scripts/check_release.py "$GITHUB_REF"

  validate:
    name: Validate the release revision
    needs: check-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish validated distributions
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/p/toolframe-llms-txt' || 'https://pypi.org/p/toolframe-llms-txt' }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/

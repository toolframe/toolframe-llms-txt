name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# This workflow is also called by publish.yml. Do not give it a concurrency
# group that can cancel its caller.
jobs:
  validate:
    name: Validate Python package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: toolframe-llms-txt
          persist-credentials: false

      - name: Check out pinned SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}/toolframe-sdk
          ref: 871416a9f9cbcfa79298235781ff193e1ad08a12
          path: toolframe-sdk
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.8'
          enable-cache: false

      - name: Run isolated local validation
        working-directory: toolframe-llms-txt
        run: bash scripts/ci.sh ../toolframe-sdk "$RUNNER_TEMP/toolframe-llms-txt-dist"

      - name: Save validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            ${{ runner.temp }}/toolframe-llms-txt-dist/*.whl
            ${{ runner.temp }}/toolframe-llms-txt-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-llms-txt"
version = "0.2.1"
description = "Standalone llms.txt provider for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "toolframe-sdk>=0.2,<0.4",
    "starlette==1.6.0",
    "uvicorn==0.42.0",
]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-llms-txt"
Repository = "https://github.com/toolframe/toolframe-llms-txt"
Documentation = "https://github.com/toolframe/toolframe-llms-txt#readme"
Issues = "https://github.com/toolframe/toolframe-llms-txt/issues"

[project.entry-points."toolframe.plugins"]
llms-txt = "toolframe_llms_txt.plugin:plugin"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
